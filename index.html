<!DOCTYPE html>
<!-- door-build: events=oct-obscura-atelier-nov-dec | images=match-github-landing-events | pass=House -->
<!-- door-build: events=oct-atelier-nov-obscura-dec | images=match-github-landing-events | pass=House -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>House of LouLou's — Door</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="LouLou Door">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#162B3B">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="https://cdn.jsdelivr.net/gh/houseofloulous/loulous-doorlist@main/apple-touch-icon.jpg">
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&display=swap" rel="stylesheet">
  <style>
    :root { --blue:#162B3B; --cream:#f5f0eb; --dark:#1a1a1a; --warm:#8c7b6b; --accent:#c9a96e; --green:#34c759; --red:#c0392b; --border:rgba(0,0,0,0.07); }
    * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    html { font-family:'Instrument Serif',serif; font-style:normal; }
    body { background:#f2ede8; font-family:'Instrument Serif',serif; color:var(--dark); min-height:100vh; font-style:normal; }
    button, input, textarea, select, option { font-family:'Instrument Serif',serif; }
    #app, #detailView, #addModal, #evScreen, button, input, textarea, select { font-style:normal; }
    #evScreen{position:fixed;inset:0;background:var(--blue);z-index:400;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;min-height:100vh;min-height:100dvh;padding:max(14px, env(safe-area-inset-top)) 24px max(12px, env(safe-area-inset-bottom));overflow-y:auto;}
    .ev-main{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;width:100%;min-height:0;padding-top:4px;}
    /* Logo: no blend/filter — avoids Safari “black box” on PNG over blue */
    .ev-logo,.logo-img{height:auto;width:auto;display:block;mix-blend-mode:normal;backface-visibility:hidden;-webkit-backface-visibility:hidden;}
    .ev-logo-link{display:inline-flex;line-height:0;margin-bottom:0;-webkit-tap-highlight-color:transparent;}
    .ev-logo-link:focus-visible{outline:2px solid var(--accent);outline-offset:4px;border-radius:4px;}
    .ev-logo{height:62px;margin-bottom:0;}
    .ev-sub{font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:rgba(255,255,255,.4);margin-bottom:32px;margin-top:12px;}
    #evScreen .ev-list{width:100%;max-width:min(100%,320px);display:flex;flex-direction:column;flex-wrap:nowrap;gap:0;row-gap:0;column-gap:0;padding:0 0 28px;box-sizing:border-box;}
    #evScreen .ev-list>button.ev-item+.ev-item{margin-top:36px;}
    button.ev-item.ev-item-art{
      display:block;width:100%;padding:0;margin:0;border:none;border-radius:12px;cursor:pointer;
      background:var(--blue);overflow:hidden;-webkit-tap-highlight-color:transparent;line-height:0;position:relative;
      box-shadow:0 4px 18px rgba(0,0,0,.35);
      transition:transform .16s,box-shadow .16s,opacity .16s;
    }
    button.ev-item.ev-item-art::after{content:none;}
    button.ev-item.ev-item-art:hover{box-shadow:0 6px 22px rgba(0,0,0,.45);}
    button.ev-item.ev-item-art:focus-visible{outline:2px solid var(--accent);outline-offset:3px;}
    button.ev-item.ev-item-art:active{transform:scale(.985);opacity:.95;}
    #evScreen .ev-list>button.ev-item.ev-item-art:last-child{box-shadow:0 2px 10px rgba(0,0,0,.28);}
    #evScreen .ev-list>button.ev-item.ev-item-art:last-child:hover{box-shadow:0 3px 14px rgba(0,0,0,.38);}
    .ev-item-art .ev-art{
      display:block;width:100%;height:auto;aspect-ratio:16/9;object-fit:cover;vertical-align:bottom;
      border:0;outline:0;border-radius:12px;
      backface-visibility:hidden;-webkit-backface-visibility:hidden;
      transform:translateZ(0);
    }
    #evScreen .ev-landing-spacer{flex:0 0 auto;width:100%;min-height:20px;max-height:20px;pointer-events:none;}
    #evScreen .ev-reset{position:relative;z-index:2;flex-shrink:0;width:100%;max-width:min(100%,320px);margin-top:0;padding:8px 12px max(20px, env(safe-area-inset-bottom));background:var(--blue);border:none;cursor:pointer;text-align:center;-webkit-font-smoothing:antialiased;font-size:13px;font-weight:500;letter-spacing:.05em;color:rgba(255,255,255,.78);}
    #app{display:none;}
    .list-header{background:var(--blue);position:sticky;top:0;z-index:100;}
    .list-top{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 8px;gap:12px;}
    .logo-link{display:inline-flex;align-items:center;-webkit-tap-highlight-color:transparent;background:none;border:none;padding:0;cursor:pointer;font:inherit;color:inherit;}
    .logo-img{height:28px;width:auto;display:block;}
    .logo-link:focus-visible{outline:2px solid var(--accent);outline-offset:4px;border-radius:4px;}
    .event-title-row{padding:0 16px 8px;text-align:center;}
    .event-title{font-size:18px;font-style:normal;color:rgba(255,255,255,.92);letter-spacing:.02em;line-height:1.25;}
    .toolbar{display:flex;gap:8px;padding:0 14px 12px;}
    .search-wrap{flex:1;position:relative;}
    .search-input{width:100%;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.1);border-radius:8px;padding:9px 12px 9px 32px;font-size:13px;color:#fff;outline:none;}
    .search-input::placeholder{color:rgba(255,255,255,.3);}
    .s-icon{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:rgba(255,255,255,.3);font-size:13px;pointer-events:none;}
    .hbtn{background:none;border:1px solid rgba(255,255,255,.2);border-radius:8px;padding:8px 12px;font-size:11px;letter-spacing:.06em;color:#fff;cursor:pointer;white-space:nowrap;}
    .hbtn.nda{border-color:var(--accent);color:var(--accent);}
    .hbtn.ratios-btn{padding:8px 10px;display:inline-flex;align-items:center;justify-content:center;gap:5px;flex-shrink:0;}
    .hbtn.ratios-btn svg{width:17px;height:17px;flex-shrink:0;display:block;}
    .hbtn.ratios-btn.active{background:rgba(255,255,255,.14);border-color:var(--accent);color:var(--accent);}
    .ratios-btn-lbl{font-size:11px;letter-spacing:.06em;}
    /* Door list tabs — grid for L'Atelier / DND; horizontal pills for Obscura. */
    .obscura-tabs-hint{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.38);text-align:center;padding:6px 16px 0;}
    .tabs{display:grid;column-gap:8px;row-gap:6px;align-items:stretch;padding:8px 8px 6px;box-sizing:border-box;border-top:1px solid rgba(255,255,255,.07);}
    .tabs.tabs-4{grid-template-columns:repeat(4,minmax(0,1fr));}
    .tabs.tabs-5{grid-template-columns:repeat(5,minmax(0,1fr));}
    .tabs.tabs-obscura{display:flex;flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;gap:7px;padding:4px 12px 12px;scrollbar-width:none;grid-template-columns:unset;}
    .tabs.tabs-obscura::-webkit-scrollbar{display:none;}
    .tabs.tabs-obscura .tab{flex:0 0 auto;width:auto;min-width:max-content;border-radius:20px;border-bottom-width:1px;padding:11px 16px;font-size:14px;letter-spacing:.08em;white-space:nowrap;}
    .tabs.tabs-obscura .tab.active{border-color:var(--accent);background:rgba(201,169,110,.18);border-bottom-color:var(--accent);}
    .app-obscura .ob-all-wrap{display:flex;flex-direction:column;gap:18px;padding:8px 0 16px;width:100%;}
    .app-obscura .ob-sec-wrap{width:100%;}
    .app-obscura .ob-sec{font-size:17px;letter-spacing:.08em;text-transform:uppercase;color:var(--dark);text-align:center;margin:8px 0 10px;font-weight:400;}
    .tab{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-bottom:3px solid rgba(255,255,255,.12);border-radius:8px 8px 0 0;padding:10px 4px 9px;font-size:12px;font-weight:600;letter-spacing:.03em;text-transform:uppercase;color:rgba(255,255,255,.48);cursor:pointer;white-space:normal;line-height:1.15;text-align:center;min-width:0;width:100%;display:flex;align-items:center;justify-content:center;transition:color .18s,background .18s,border-color .18s,font-weight .18s;-webkit-hyphens:manual;hyphens:manual;}
    .tab.active{color:#fff;font-weight:800;background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.22);border-bottom-color:var(--accent);box-shadow:inset 0 -1px 0 rgba(255,255,255,.1);}
    @media(min-width:400px){
      .tab{padding:11px 5px 10px;font-size:13px;letter-spacing:.04em;}
    }
    @media(min-width:520px){
      .tab{padding:12px 6px 11px;font-size:14px;letter-spacing:.05em;}
    }
    .stats{padding:9px 16px;display:flex;gap:14px;background:var(--cream);border-bottom:1px solid var(--border);}
    .stat{font-size:12px;color:var(--warm);}
    .stat-pending{color:var(--accent);cursor:pointer;-webkit-tap-highlight-color:transparent;}
    .stat b{color:var(--dark);font-style:normal;font-weight:400;}
    /** Guest grid: flex-wrap + centered rows. */
    #main{width:100%;}
    .grid{
      --ggrid:10px;
      --guest-card-w:clamp(138px,min(206px,(100vw - 48px)/3),216px);
      display:flex;
      flex-wrap:wrap;
      justify-content:center;
      align-items:stretch;
      align-content:flex-start;
      gap:var(--ggrid);
      padding:14px;
      max-width:1200px;
      margin:0 auto;
      box-sizing:border-box;
      width:100%;
    }
    .grid>.card{flex:0 0 auto;width:var(--guest-card-w);}
    /** Tables tab: seated parties grouped in a gold frame */
    .tables-grid{flex-direction:column;align-items:stretch;gap:14px;}
    .table-party{
      width:100%;
      border:1.5px solid var(--accent);
      border-radius:14px;
      padding:12px 12px 14px;
      background:linear-gradient(180deg,rgba(201,169,110,.1) 0%,rgba(255,255,255,.55) 100%);
      box-shadow:0 1px 4px rgba(0,0,0,.05);
      box-sizing:border-box;
    }
    .table-party-inner{
      display:flex;
      flex-wrap:wrap;
      justify-content:center;
      align-items:stretch;
      gap:var(--ggrid);
    }
    .table-party-inner>.card{flex:0 0 auto;width:var(--guest-card-w);}
    .card{background:#fff;border-radius:10px;overflow:hidden;cursor:pointer;position:relative;box-shadow:0 1px 4px rgba(0,0,0,.07);transition:transform .12s,filter .15s,opacity .15s;}
    .card:active{transform:scale(.96);}
    .card.checked{filter:grayscale(1);opacity:.62;}
    .card-photo{width:100%;aspect-ratio:1;object-fit:cover;display:block;background:#e8e2da;}
    .card-init{width:100%;aspect-ratio:1;background:linear-gradient(135deg,#ebe5dd,#d9d1c7);display:flex;align-items:center;justify-content:center;font-size:26px;color:var(--warm);}
    .card-body{padding:7px 8px 8px;}
    .card-name{font-size:11px;color:var(--dark);line-height:1.3;}
    .card-tick{color:var(--blue);font-size:16px;margin-right:4px;font-weight:700;line-height:1;}
    .card-tag{font-size:9px;letter-spacing:.07em;text-transform:uppercase;color:var(--warm);margin-top:2px;display:flex;align-items:center;gap:3px;}
    @media(min-width:481px){
      .card-body{padding:8px 9px 10px;}
      .card-name{font-size:15px;line-height:1.35;}
      .card-tag{font-size:11px;margin-top:3px;}
      .card-tick{font-size:18px;}
    }
    @media(min-width:768px){
      .card-body{padding:10px 10px 12px;}
      .card-name{font-size:18px;line-height:1.35;}
      .card-tag{font-size:12px;}
      .card-tick{font-size:22px;}
    }
    .card-cabaret{font-size:11px;line-height:1;flex-shrink:0;}
    .wb-dot{width:6px;height:6px;border-radius:50%;display:inline-block;}
    .wb-gold{background:#c9a96e;}
    .wb-black{background:#1a1a1a;border:1px solid #bbb;}
    .cstate{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:64px 20px;gap:14px;}
    .spinner{width:26px;height:26px;border:2px solid rgba(0,0,0,.1);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;}
    @keyframes spin{to{transform:rotate(360deg);}}
    .cstate-txt{font-size:13px;color:var(--warm);letter-spacing:.1em;}
    .ratios-wrap{max-width:820px;margin:0 auto;padding:16px 14px 28px;}
    .ratios-grid{display:grid;grid-template-columns:1fr;gap:14px;}
    @media(min-width:560px){.ratios-grid{grid-template-columns:1fr 1fr;}}
    .ratio-card{background:#fff;border:1px solid rgba(0,0,0,.07);border-radius:14px;padding:18px 16px 16px;box-shadow:0 1px 5px rgba(0,0,0,.05);}
    .ratio-title{font-size:16px;color:var(--dark);margin-bottom:14px;letter-spacing:.02em;text-align:center;}
    .ratio-body{display:flex;align-items:center;justify-content:center;gap:16px;}
    .ratio-pie{flex:0 0 auto;width:132px;height:132px;position:relative;filter:drop-shadow(0 2px 8px rgba(0,0,0,.07));}
    .ratio-pie svg{display:block;width:132px;height:132px;}
    .ratio-pie-empty{width:132px;height:132px;border-radius:50%;background:conic-gradient(from -90deg,#ebe5dd 0 33%,#e3ddd5 33% 66%,#ebe5dd 66% 100%);border:2px solid #fff;display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--warm);text-align:center;padding:10px;line-height:1.35;box-shadow:inset 0 0 0 1px rgba(0,0,0,.05);}
    .ratio-legend{flex:1;min-width:0;display:flex;flex-direction:column;gap:10px;}
    .ratio-leg-row{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--dark);line-height:1.25;}
    .ratio-swatch{width:12px;height:12px;border-radius:50%;flex-shrink:0;box-shadow:inset 0 0 0 1px rgba(0,0,0,.06);}
    .ratio-leg-lbl{flex:1;}
    .ratio-leg-pct{color:var(--warm);font-size:12px;white-space:nowrap;}
